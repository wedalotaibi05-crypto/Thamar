  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

ercase;padding:4px 9px;border-radius:99px;background:#F5F1E8;color:#244C39\">Sample data<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px\">\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:32px;line-height:1\">128 kg<\u002Fspan>\n        <span style=\"font-size:12.5px;color:#DCE8D8\">Food saved<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:32px;line-height:1\">14<\u002Fspan>\n        <span style=\"font-size:12.5px;color:#DCE8D8\">Donations completed<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:11.5px;color:#DCE8D8\">Illustrative prototype figures, not real results.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ 4. SCANNER ============ -->\n<sc-if value=\"{{isScanner}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:22px 24px 22px;box-sizing:border-box;gap:14px;background:#F5F1E8\">\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <span style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:27px;line-height:1.1\">AI Food Scanner<\u002Fspan>\n      <span style=\"font-size:12.5px;color:#55695C\">Point at food to fill in its details.<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"flex:none;display:inline-flex;align-items:center;gap:6px;padding:6px 11px 6px 9px;border-radius:99px;background:#DCE8D8;color:#1F4431;font-size:11.5px;font-weight:700\">\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c-1.2-8 3.8-13.6 14-14.5.6 9.2-3.8 14.8-11.4 14.8-.9 0-1.8-.1-2.6-.3z\"><\u002Fpath><path d=\"M5 19c3-5.5 6.2-8.6 10.5-10.6\"><\u002Fpath><\u002Fsvg>\n      AI prototype\n    <\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- camera -->\n  <div style=\"position:relative;height:286px;border-radius:28px;overflow:hidden;flex:none;box-shadow:0 10px 24px rgba(36,76,57,.22)\">\n    <svg sc-camel-view-box=\"0 0 342 286\" width=\"342\" height=\"286\" role=\"img\" aria-label=\"Simulated camera view of a plate of cooked rice with vegetables\" style=\"display:block;max-width:100%\">\n      <defs><linearGradient id=\"cam\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#1C3A2B\"><\u002Fstop><stop offset=\"1\" stop-color=\"#2E5A44\"><\u002Fstop><\u002FlinearGradient><\u002Fdefs>\n      <rect width=\"342\" height=\"286\" fill=\"url(#cam)\"><\u002Frect>\n      <circle cx=\"171\" cy=\"148\" r=\"104\" fill=\"#EFE9D8\"><\u002Fcircle>\n      <circle cx=\"171\" cy=\"148\" r=\"88\" fill=\"none\" stroke=\"#D9D0B8\" stroke-width=\"2\"><\u002Fcircle>\n      <path d=\"M100 158c0-32 30-54 71-54s71 22 71 54c0 24-28 36-71 36s-71-12-71-36z\" fill=\"#FFFDF8\"><\u002Fpath>\n      <g fill=\"#EDE5CF\"><ellipse cx=\"132\" cy=\"140\" rx=\"7\" ry=\"3\" transform=\"rotate(-20 132 140)\"><\u002Fellipse><ellipse cx=\"156\" cy=\"128\" rx=\"7\" ry=\"3\" transform=\"rotate(25 156 128)\"><\u002Fellipse><ellipse cx=\"184\" cy=\"132\" rx=\"7\" ry=\"3\" transform=\"rotate(-35 184 132)\"><\u002Fellipse><ellipse cx=\"208\" cy=\"146\" rx=\"7\" ry=\"3\" transform=\"rotate(15 208 146)\"><\u002Fellipse><ellipse cx=\"150\" cy=\"160\" rx=\"7\" ry=\"3\" transform=\"rotate(-10 150 160)\"><\u002Fellipse><ellipse cx=\"178\" cy=\"164\" rx=\"7\" ry=\"3\" transform=\"rotate(30 178 164)\"><\u002Fellipse><\u002Fg>\n      <g fill=\"#E3A04A\"><rect x=\"140\" y=\"146\" width=\"9\" height=\"9\" rx=\"2\"><\u002Frect><rect x=\"190\" y=\"150\" width=\"9\" height=\"9\" rx=\"2\"><\u002Frect><rect x=\"164\" y=\"138\" width=\"9\" height=\"9\" rx=\"2\"><\u002Frect><rect x=\"206\" y=\"168\" width=\"9\" height=\"9\" rx=\"2\"><\u002Frect><\u002Fg>\n      <g fill=\"#8FAF91\"><circle cx=\"128\" cy=\"160\" r=\"4.5\"><\u002Fcircle><circle cx=\"198\" cy=\"130\" r=\"4.5\"><\u002Fcircle><circle cx=\"170\" cy=\"172\" r=\"4.5\"><\u002Fcircle><circle cx=\"148\" cy=\"176\" r=\"4.5\"><\u002Fcircle><circle cx=\"218\" cy=\"152\" r=\"4.5\"><\u002Fcircle><\u002Fg>\n      <path transform=\"translate(178 118) rotate(-120)\" d=\"M0 0C6-12 19-16 29-13C26-1 14 7 0 0Z\" fill=\"#244C39\"><\u002Fpath>\n      <path transform=\"translate(120 128) rotate(-30)\" d=\"M0 0C6-12 19-16 29-13C26-1 14 7 0 0Z\" fill=\"#3F6B53\"><\u002Fpath>\n    <\u002Fsvg>\n    <svg sc-camel-view-box=\"0 0 342 286\" width=\"342\" height=\"286\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none\">\n      <g fill=\"none\" stroke=\"#F5F1E8\" stroke-width=\"3\" stroke-linecap=\"round\">\n        <path d=\"M24 62V42a14 14 0 0 1 14-14h20\"><\u002Fpath><path d=\"M318 62V42a14 14 0 0 0-14-14h-20\"><\u002Fpath><path d=\"M24 224v20a14 14 0 0 0 14 14h20\"><\u002Fpath><path d=\"M318 224v20a14 14 0 0 1-14 14h-20\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n    <sc-if value=\"{{scanScanning}}\" hint-placeholder-val=\"{{false}}\">\n      <svg sc-camel-view-box=\"0 0 342 286\" width=\"342\" height=\"286\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none\">\n        <rect x=\"24\" y=\"30\" width=\"294\" height=\"4\" rx=\"2\" fill=\"#8FAF91\" opacity=\"0.95\"><animate sc-camel-attribute-name=\"y\" values=\"30;250;30\" dur=\"1.6s\" sc-camel-repeat-count=\"indefinite\"><\u002Fanimate><\u002Frect>\n      <\u002Fsvg>\n    <\u002Fsc-if>\n    <sc-if value=\"{{scanDone}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:absolute;left:58px;top:54px;width:226px;height:186px;border:2px dashed #8FAF91;border-radius:20px;pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:absolute;left:58px;top:20px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;background:#F5F1E8;color:#1F4431;font-size:12px;font-weight:700\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c-1.2-8 3.8-13.6 14-14.5.6 9.2-3.8 14.8-11.4 14.8-.9 0-1.8-.1-2.6-.3z\"><\u002Fpath><path d=\"M5 19c3-5.5 6.2-8.6 10.5-10.6\"><\u002Fpath><\u002Fsvg>\n        {{scanName}} · 92%\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"position:absolute;left:12px;bottom:12px;padding:5px 10px;border-radius:99px;background:rgba(20,36,28,.62);color:#F5F1E8;font-size:11px;font-weight:600\">Sample photo · camera simulated<\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{scanIdle}}\" hint-placeholder-val=\"{{true}}\">\n    <button type=\"button\" sc-camel-on-click=\"{{startScan}}\" style=\"flex:none;height:56px;border-radius:18px;border:0;background:#244C39;color:#F5F1E8;font-family:inherit;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 18px rgba(36,76,57,.24);cursor:pointer\">\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"21\" height=\"21\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10\"><\u002Fpath><\u002Fsvg>\n      Scan Food\n    <\u002Fbutton>\n  <\u002Fsc-if>\n  <sc-if value=\"{{scanScanning}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"flex:none;height:56px;border-radius:18px;background:#DCE8D8;color:#1F4431;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px\" role=\"status\">Scanning sample photo…<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{scanDone}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"flex:none;border-radius:24px;background:#FFFDF8;border:1px solid #E6DFCD;box-shadow:0 6px 18px rgba(36,76,57,.08);padding:16px;display:flex;flex-direction:column;gap:12px\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n        <span style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px\">Detected food<\u002Fspan>\n        <span style=\"font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:#DCE8D8;color:#1F4431\">92% confidence<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{notEditing}}\" hint-placeholder-val=\"{{true}}\">\n        <div style=\"display:flex;flex-direction:column;gap:9px;font-size:14px\">\n          <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#55695C\">Food<\u002Fspan><span style=\"font-weight:700;text-align:right\">{{scanName}}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#55695C\">Quantity<\u002Fspan><span style=\"font-weight:700;text-align:right\">{{scanQty}}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#55695C\">Prepared<\u002Fspan><span style=\"font-weight:700;text-align:right\">1 h ago<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;gap:12px\"><span style=\"color:#55695C\">Estimated expiry<\u002Fspan><span style=\"font-weight:700;text-align:right\">In about 8 h<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{isEditing}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <label for=\"scan-name\" style=\"font-size:12.5px;font-weight:600\">Food name<\u002Flabel>\n            <input id=\"scan-name\" type=\"text\" value=\"{{scanName}}\" sc-camel-on-change=\"{{setScanName}}\" style=\"height:46px;border-radius:14px;border:1.5px solid #244C39;background:#FFFDF8;padding:0 14px;font-family:inherit;font-size:15px;color:#244C39;box-sizing:border-box;width:100%\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:5px\">\n            <label for=\"scan-qty\" style=\"font-size:12.5px;font-weight:600\">Quantity<\u002Flabel>\n            <input id=\"scan-qty\" type=\"text\" value=\"{{scanQty}}\" sc-camel-on-change=\"{{setScanQty}}\" style=\"height:46px;border-radius:14px;border:1.5px solid #244C39;background:#FFFDF8;padding:0 14px;font-family:inherit;font-size:15px;color:#244C39;box-sizing:border-box;width:100%\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:10px\">\n        <button type=\"button\" sc-camel-on-click=\"{{confirmScan}}\" style=\"flex:1;height:50px;border-radius:16px;border:0;background:#244C39;color:#F5F1E8;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer\">Confirm &amp; Add<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{toggleEdit}}\" style=\"flex:1;height:50px;border-radius:16px;border:1.5px solid #244C39;background:transparent;color:#244C39;font-family:inherit;font-weight:700;font-size:14.5px;cursor:pointer\">{{editLabel}}<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-size:11.5px;line-height:1.45;color:#55695C\">AI identification is a prototype feature. Review and confirm or edit the details before saving. A scan never guarantees food safety.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:none;border-radius:24px;background:#DCE8D8;padding:16px;display:flex;flex-direction:column;gap:10px\">\n      <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#1F4431\">\n        <svg sc-camel-view-box=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c-1.2-8 3.8-13.6 14-14.5.6 9.2-3.8 14.8-11.4 14.8-.9 0-1.8-.1-2.6-.3z\"><\u002Fpath><path d=\"M5 19c3-5.5 6.2-8.6 10.5-10.6\"><\u002Fpath><\u002Fsvg>\n        AI insight\n      <\u002Fspan>\n      <span style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:19px;line-height:1.25\">About 6 of 20 meals may stay unclaimed by 7 PM<\u002Fspan>\n      <span style=\"font-size:13px;line-height:1.45;color:#33493C\">Sample prediction based on example usage history. Donating by 5:30 PM leaves time for pickup before the food expires.<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{openAddFromScan}}\" style=\"align-self:flex-start;height:44px;padding:0 18px;border-radius:14px;border:0;background:#244C39;color:#F5F1E8;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer\">Plan a donation<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- inventory -->\n  <div style=\"display:flex;flex-direction:column;gap:10px;flex:none\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between\">\n      <span style=\"font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:20px\">My inventory<\u002Fspan>\n      <span style=\"font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:#ECE6D4;color:#5A4F36\">Sample data<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{inventory}}\" as=\"it\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:20px;border:1px solid #E6DFCD;background:#FFFDF8\">\n        <div style=\"display:flex;align-items:center;gap:12px\">\n          <span style=\"width:44px;height:44px;border-radius:14px;background:#DCE8D8;color:#244C39;display:fl ES = [\n      { id: 'donor', title: 'Donor', d: ICON.donor, desc: 'Households, restaurants, cafeterias and university facilities sharing surplus food.', note: 'Add food, predict surplus and create donations.' },\n      { id: 'volunteer', title: 'Volunteer', d: ICON.volunteer, desc: 'People helping collect and deliver donations.', note: 'View nearby pickups, then confirm collection and delivery.' },\n      { id: 'recipient', title: 'Recipient', d: ICON.recipient, desc: 'Charities, food banks and approved recipients receiving donations.', note: 'Set your capacity and accept donations. An Administrator approves new recipients.' },\n      { id: 'admin', title: 'Administrator', d: ICON.admin, desc: 'People managing users, donations and platform activity.', note: 'Approve organizations, manage users and monitor activity.' }\n    ];\n    const role = ROLES.find((r) => r.id === s.role) || ROLES[0];\n\n    const scr = s.screen;\n    const go = (screen) => () => up({ screen, sheet: 'none', err: '' });\n\n    const flash = (msg) => {\n      clearTimeout(this._toastT);\n      up({ toast: msg });\n      this._toastT = setTimeout(() => up({ toast: '' }), 2600);\n    };\n\n    // ---- data ----\n    const DON = [\n      { id: 'd1', num: '1', title: 'Cooked rice meals', qty: '20 meals', type: 'Cooked meals', kind: 'soon', fresh: 'Best within 4 h', pickup: 'today, 6:30 to 7:30 PM', pickupShort: '6:30 PM', dist: '0.4 km', donor: 'University Cafeteria, PSU Campus', d: ICON.bowl, x: 236, y: 62 },\n      { id: 'd2', num: '2', title: 'Fresh bread loaves', qty: '30 loaves', type: 'Bakery', kind: 'fresh', fresh: 'Fresh, about 20 h left', pickup: 'today, 8:00 to 9:00 PM', pickupShort: '8:00 PM', dist: '0.9 km', donor: 'Partner bakery (sample)', d: ICON.bread, x: 278, y: 150 },\n      { id: 'd3', num: '3', title: 'Fruit boxes', qty: '12 boxes', type: 'Produce', kind: 'fresh', fresh: 'Fresh, about 2 days left', pickup: 'tomorrow, 9:00 to 10:00 AM', pickupShort: 'Tomorrow', dist: '1.3 km', donor: 'Household donor (sample)', d: ICON.box, x: 236, y: 196 }\n    ];\n    const openDetail = (id) => () => up({ sel: id, sheet: 'detail', screen: 'donations' });\n\n    // ---- role cards ----\n    const roles = ROLES.map((r) => {\n      const on = r.id === s.role;\n      return {\n        id: r.id, title: r.title, desc: r.desc, d: r.d,\n        pressed: on ? 'true' : 'false',\n        border: on ? '#244C39' : '#DDD6C2',\n        bg: on ? '#DCE8D8' : '#FFFDF8',\n        iconBg: on ? '#244C39' : '#F1EADA',\n        iconFg: on ? '#F5F1E8' : '#244C39',\n        checkOp: on ? '1' : '0',\n        pick: () => up({ role: r.id })\n      };\n    });\n\n    // ---- derived text ----\n    const first = (s.name || '').trim().split(/\\s+/)[0];\n    const displayName = first || 'Layla';\n    const initial = displayName.charAt(0).toUpperCase();\n\n    // ---- inventory ----\n    const baseInv = [\n      { id: 'rice', name: 'Cooked rice meals', qty: '20 meals', exp: 'Expires in 4 h', kind: 'soon', d: ICON.bowl },\n      { id: 'bread', name: 'Bread loaves', qty: '30 loaves', exp: 'Expires in 20 h', kind: 'fresh', d: ICON.bread },\n      { id: 'yogurt', name: 'Yogurt cups', qty: '12 pcs', exp: 'Expired 1 h ago', kind: 'expired', d: ICON.box }\n    ];\n    const allInv = s.extraInv.concat(baseInv);\n    const inventory = allInv.map((i) => ({\n      name: i.name, qty: i.qty, exp: i.exp, d: i.d,\n      pillBg: KIND[i.kind].bg, pillFg: KIND[i.kind].fg, pillLabel: KIND[i.kind].label,\n      blocked: i.kind === 'expired'\n    }));\n    const invCount = allInv.length;\n    const invSoon = allInv.filter((i) => i.kind === 'soon').length;\n    const invReady = allInv.filter((i) => i.kind !== 'expired').length;\n\n    // ---- nearby donations (home) ----\n    const nearby = DON.map((d) => ({\n      title: d.title, qty: d.qty, dist: d.dist, pickupShort: d.pickupShort, d: d.d,\n      pillBg: KIND[d.kind].bg, pillFg: KIND[d.kind].fg, pillLabel: KIND[d.kind].label,\n      open: openDetail(d.id)\n    }));\n\n    // ---- donations screen ----\n    const donations = DON.map((d) => ({\n      num: d.num, title: d.title, qty: d.qty, type: d.type, dist: d.dist, pickup: d.pickup, fresh: d.fresh, d: d.d,\n      pillBg: KIND[d.kind].bg, pillFg: KIND[d.kind].fg, pillLabel: KIND[d.kind].label,\n      border: s.sel === d.id ? '#244C39' : '#E6DFCD',\n      open: openDetail(d.id)\n    }));\n    const markers = DON.map((d) => {\n      const on = s.sel === d.id;\n      return {\n        left: d.x - 20, top: d.y - 20, num: d.num, isNumber: true, isFridge: false,\n        label: 'Donation ' + d.num + ': ' + d.title,\n        pressed: on ? 'true' : 'false',\n        bg: on ? '#244C39' : '#FFFDF8', fg: on ? '#F5F1E8' : '#244C39',\n        shadow: on ? '0 6px 14px rgba(36,76,57,.45)' : '0 3px 8px rgba(36,76,57,.25)',\n        pick: () => up({ sel: d.id })\n      };\n    });\n    const fridgeOn = s.sel === 'fridge';\n    markers.push({\n      left: 130, top: 176, num: '', isNumber: false, isFridge: true,\n      label: 'Community fridge near PSU Campus',\n      pressed: fridgeOn ? 'true' : 'false',\n      bg: fridgeOn ? '#244C39' : '#C6B99F', fg: fridgeOn ? '#F5F1E8' : '#244C39',\n      shadow: fridgeOn ? '0 6px 14px rgba(36,76,57,.45)' : '0 3px 8px rgba(36,76,57,.25)',\n      pick: () => up({ sel: 'fridge' })\n    });\n    const fridgeItems = [\n      { name: 'Fruit boxes', qty: '4 boxes', fresh: 'Fresh, 2 days left', kind: 'fresh' },\n      { name: 'Sandwiches', qty: '6 pcs', fresh: 'Best within 10 h', kind: 'fresh' },\n      { name: 'Salad bowls', qty: '3 bowls', fresh: 'Best within 3 h', kind: 'soon' }\n    ].map((f) => ({ name: f.name, qty: f.qty, fresh: f.fresh, pillBg: KIND[f.kind].bg, pillFg: KIND[f.kind].fg, pillLabel: KIND[f.kind].label }));\n\n    // ---- detail sheet ----\n    const dsel = DON.find((d) => d.id === s.sel) || DON[0];\n    const det = { d: dsel.d, title: dsel.title, pillBg: KIND[dsel.kind].bg, pillFg: KIND[dsel.kind].fg, pillLabel: KIND[dsel.kind].label };\n    const detRows = [\n      { k: 'Food type', v: dsel.type },\n      { k: 'Quantity', v: dsel.qty },\n      { k: 'Freshness', v: dsel.fresh },\n      { k: 'Pickup time', v: dsel.pickup.charAt(0).toUpperCase() + dsel.pickup.slice(1) },\n      { k: 'Distance', v: dsel.dist + ' from PSU Campus' },\n      { k: 'Donor', v: dsel.donor },\n      { k: 'Status', v: 'Available' }\n    ];\n    const isReq = !!s.requested[dsel.id];\n\n    // ---- add donation sheet ----\n    const ITEMS = { rice: { label: 'Cooked rice meals', unit: 'meals', max: 20, name: 'Cooked rice meals' }, bread: { label: 'Bread loaves', unit: 'loaves', max: 30, name: 'Bread loaves' } };\n    const cur = ITEMS[s.addItem] || ITEMS.rice;\n    const addItems = Object.keys(ITEMS).map((k) => {\n      const on = s.addItem === k;\n      return { label: ITEMS[k].label, pressed: on ? 'true' : 'false', border: on ? '#244C39' : '#DDD6C2', bg: on ? '#DCE8D8' : '#FFFDF8', pick: () => up({ addItem: k, addQty: ITEMS[k].max }) };\n    });\n    const addTimes = [['1', 'In 1 h'], ['2', 'In 2 h'], ['3', 'In 3 h']].map((t) => {\n      const on = s.addTime === t[0];\n      return { label: t[1], pressed: on ? 'true' : 'false', border: on ? '#244C39' : '#DDD6C2', bg: on ? '#DCE8D8' : '#FFFDF8', pick: () => up({ addTime: t[0] }) };\n    });\n    const RECS = { malaz: { name: 'Al Malaz Distribution Point', sub: '5.9 km · capacity 60 (sample)', match: '82%' }, hope: { name: 'Hope Charity, Al Nakheel', sub: '10.0 km · capacity 25 (sample)', match: '70%' } };\n    const addRecs = Object.keys(RECS).map((k) => {\n      const on = s.addRec === k;\n      return { name: RECS[k].name, sub: RECS[k].sub, match: RECS[k].match, pressed: on ? 'true' : 'false', border: on ? '#244C39' : '#DDD6C2', bg: on ? '#DCE8D8' : '#FFFDF8', pick: () => up({ addRec: k }) };\n    });\n    const timeLabel = { '1': 'in 1 hour', '2': 'in 2 hours', '3': 'in 3 hours' }[s.addTime];\n    const addSummary = s.addQty + ' ' + cur.unit + ' of ' + cur.name.toLowerCase() + ' offered to ' + RECS[s.addRec].name + ', pickup ' + timeLabel + ' at University Cafeteria, PSU Campus.';\n    const steps = ['Available', 'Pickup Assigned', 'Collected', 'Delivered'].map((l, i) => ({\n      label: l, dot: i === 0 ? '#244C39' : '#FFFDF8',\n      lineL: i === 0 ? 'transparent' : '#D6CFBA',\n      lineR: i === 3 ? 'transparent' : '#D6CFBA'\n    }));\n\n    // ---- primary action on home ----\n    const PRIMARY = {\n      donor: { label: 'Add Donation', run: () => up({ sheet: 'add', created: false }) },\n      volunteer: { label: 'Find Pickups', run: go('donations') },\n      recipient: { label: 'Browse Donations', run: go('donations') },\n      admin: { label: 'Review Donations', run: go('donations') }\n    };\n    const prim = PRIMARY[s.role] || PRIMARY.donor;\n\n    // ---- nav ----\n    const NAV = [\n      { id: 'home', label: 'Home', d: ICON.home },\n      { id: 'scanner', label: 'Scanner', d: ICON.scan },\n      { id: 'donations', label: 'Donations', d: ICON.heart },\n      { id: 'profile', label: 'Profile', d: ICON.user }\n    ];\n    const nav = NAV.map((n) => {\n      const on = scr === n.id;\n      return { label: n.label, d: n.d, go: go(n.id), current: on ? 'page' : 'false', color: on ? '#244C39' : '#5C6F63', bubble: on ? '#DCE8D8' : 'transparent', weight: on ? '700' : '500' };\n    });\n\n    return {\n      isWelcome: scr === 'welcome', isLogin: scr === 'login', isSignup: scr === 'signup',\n      isHome: scr === 'home', isScanner: scr === 'scanner', isDonations: scr === 'donations', isProfile: scr === 'profile',\n      showNav: ['home', 'scanner', 'donations', 'profile'].indexOf(scr) >= 0,\n      toWelcome: go('welcome'), toLogin: go('login'), toSignup: go('signup'),\n      toHome: go('home'), toScanner: go('scanner'), toDonations: go('donations'), toProfile: go('profile'),\n\n      roles, roleTitle: role.title, roleNote: role.note, roleIcon: role.d,\n      name: s.name, email: s.email, pw: s.pw, pw2: s.pw2, err: s.err, hasErr: !!s.err,\n      setName: (e) => up({ name: e.target.value }),\n      setEmail: (e) => up({ email: e.target.value }),\n      setPw: (e) => up({ pw: e.target.value }),\n      setPw2: (e) => up({ pw2: e.target.value }),\n      doCreate: () => {\n        if (s.pw !== s.pw2) { up({ err: 'Passwords do not match. Check both fields and try again.' }); return; }\n        up({ screen: 'home', err: '', sheet: 'none' });\n      },\n      doLogin: () => up({ screen: 'home', err: '', sheet: 'none' }),\n      doLogout: () => up({ screen: 'welcome', sheet: 'none', pw: '', pw2: '' }),\n\n      displayName, initial, emailShown: s.email || 'No email entered (prototype)',\n      primaryLabel: prim.label, primaryAction: prim.run,\n      invCount, invSoon, invReady, nearby, inventory,\n\n      scanIdle: s.scan === 'idle', scanScanning: s.scan === 'scanning', scanDone: s.scan === 'done',\n      scanName: s.scanName, scanQty: s.scanQty,\n      isEditing: s.editing, notEditing: !s.editing, editLabel: s.editing ? 'Done editing' : 'Edit details',\n      startScan: () => {\n        up({ scan: 'scanning', editing: false });\n        clearTimeout(this._scanT);\n        this._scanT = setTimeout(() => up({ scan: 'done' }), 1600);\n      },\n      toggleEdit: () => up({ editing: !s.editing }),\n      setScanName: (e) => up({ scanName: e.target.value }),\n      setScanQty: (e) => up({ scanQty: e.target.value }),\n      confirmScan: () => {\n        const item = { id: 'n' + Date.now(), name: s.scanName || 'Cooked rice', qty: s.scanQty || '20 meals', exp: 'Expires in about 8 h', kind: 'fresh', d: ICON.bowl };\n        up({ extraInv: [item].concat(s.extraInv), scan: 'idle', editing: false, scanName: 'Cooked rice', scanQty: '20 meals' });\n        flash('Added to your inventory (sample data).');\n      },\n      openAddFromScan: () => up({ sheet: 'add', created: false }),\n\n      donations, markers, fridgeItems, fridgeBorder: fridgeOn ? '#244C39' : '#E6DFCD',\n\n      nav,\n      toastOn: !!s.toast, toast: s.toast,\n\n      sheetAdd: s.sheet === 'add', sheetDetail: s.sheet === 'detail',\n      closeSheet: () => up({ sheet: 'none' }),\n      addForm: !s.created, addDone: s.created,\n      addItems, addTimes, addRecs, addQtyLabel: s.addQty + ' ' + cur.unit,\n      qtyDown: () => up({ addQty: Math.max(5, s.addQty - 5) }),\n      qtyUp: () => up({ addQty: Math.min(cur.max, s.addQty + 5) }),\n      createDonation: () => up({ created: true }),\n      addSummary, steps,\n\n      det, detRows, isRequested: isReq, notRequested: !isReq,\n      requestDonation: () => up({ requested: Object.assign({}, s.requested, { [dsel.id]: true }) })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
